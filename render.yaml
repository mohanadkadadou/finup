# One-click deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: finup
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: finup-db
          property: connectionString
      - key: APP_URL
        sync: false # set to your https://<name>.onrender.com URL after first deploy
      - key: ANTHROPIC_API_KEY
        sync: false # optional
databases:
  - name: finup-db
    plan: free
